# Installed by deploy.sh. Don't add your own address here: put it in gifty.local beside this file, which git
# ignores and deploy.sh installs too (see deploy/README.md), so it never ends up in the repository.
[DEFAULT]
ignoreip = 127.0.0.1/8 ::1
banaction = nftables
bantime.increment = true
bantime.maxtime = 1w

[gifty]
enabled = true
filter = gifty
backend = systemd
journalmatch = _SYSTEMD_UNIT=gifty.service
port = http,https
maxretry = 10
findtime = 10m
bantime = 1h

[gifty-web]
enabled = true
filter = gifty-web
backend = auto
logpath = /var/log/caddy/access.log
port = http,https
maxretry = 20
findtime = 5m
bantime = 1h
