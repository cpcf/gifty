# Matches Caddy's JSON access log for requests that were malformed or asked for something that isn't there,
# which is what scanners and probes produce. The app's own rejections are covered by the gifty filter.
[Definition]
failregex = ^.*"remote_ip":"<HOST>",.*"status":(?:400|404|405)[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
