# Matches the "security: <event> ip=<address>" lines Gifty writes to the journal (security.go).
[Definition]
failregex = ^.*security: (?:login_failed|access_code_wrong|access_denied|auth_rate_limited|account_locked|token_refused|origin_refused|write_rate_limited|read_rate_limited|mail_rate_limited) ip=<HOST>\s*$
ignoreregex =
